[project]
name = "kass-backend"
version = "0.8.0"
requires-python = ">=3.12"

# ---------------------------------------------------------------------------
# Ruff – linter + formatter
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["."]

# Files/dirs to skip entirely.
extend-exclude = [
    "kass-server.spec",
    "build_binary.py",
]

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade (modernize syntax for 3.12)
    "B",     # flake8-bugbear
    "A",     # flake8-builtins (shadowing built-in names)
    "SIM",   # flake8-simplify
    "T20",   # flake8-print (flag print() calls)
    "RET",   # flake8-return
    "PIE",   # misc lints
    "PT",    # flake8-pytest-style
    "RUF",   # ruff-specific rules
    "ERA",   # commented-out code detection
    "FIX",   # flag TODO/FIXME/HACK/XXX for review
]

ignore = [
    # Allow print() in existing code -- remove items from this list as files
    # are migrated to logging during the refactor.
    "T201",   # print() found

    # These conflict with the formatter or are too noisy during migration:
    "E501",   # line too long (formatter handles this)
    "RET504", # unnecessary assignment before return
    "SIM108", # use ternary operator (sometimes less readable)
    "B008",   # function call in default argument (FastAPI Depends() pattern)
    "UP007",  # use X | Y for union (auto-fixed by UP, but noisy on big diffs)
    # Kass writes paths in the app as "Settings › General", and tests use
    # characters like × on purpose; these are not typos for > and x.
    "RUF001", # ambiguous unicode character in a string
    "RUF002", # ambiguous unicode character in a docstring
    "RUF003", # ambiguous unicode character in a comment
]

# Per-file rule overrides.
[tool.ruff.lint.per-file-ignores]
# Tests can use assert, print, and magic values freely.
"tests/**" = ["S101", "T201", "PLR2004", "ERA001"]
# __init__.py re-exports are expected to have unused imports.
"**/__init__.py" = ["F401"]
# Entry points and scripts legitimately use print. In server.py,
# freeze_support() and the output guard must also run before the heavy
# imports, or the bundled server's worker processes and closed pipes break.
"server.py" = ["T201", "E402"]
"main.py" = ["T201"]
# Logging is configured before the heavy imports so their log lines are formatted.
"app.py" = ["E402"]
# The offline patch must be applied before anything imports huggingface_hub.
"backends/mlx_backend.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
# Group "from backend.*" imports into the first-party section.
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
# Ruff formats Python inside Markdown too; the style guide's examples are
# aligned by hand to teach, so leave Markdown alone.
exclude = ["*.md"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
