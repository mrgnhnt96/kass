[package]
name = "kass"
version = "0.9.0"
description = "Local dictation for macOS"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-opener = "2"
tauri-plugin-notification = "=2.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["blocking", "json", "stream", "multipart"] }
hound = "3.5"
cpal = "0.15"
scopeguard = "1.2.0"
# Native dictation: WebSocket client for /captures/stream and a realtime-safe
# ring buffer between the CoreAudio callback and the streaming thread.
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rtrb = "0.4"
# AppKit / Accessibility / CoreGraphics FFI for focus capture, clipboard,
# synthetic paste and the dictate pill panel.
objc = "0.2"
core-foundation-sys = "0.8"
tauri-plugin-updater = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Observe-only global keyboard tap with left/right modifier fidelity,
# which is the hard requirement the chord engine needs. keytap is our own
# crate (jamiepine/keytap), published to crates.io, that replaces the
# abandoned Narsil/rdev we previously pinned via git — same capability
# surface, clean shutdown via Drop, no `set_is_main_thread(false)`
# dance required (the Sonoma-crashing layout-translation path simply
# isn't called).
keytap = "0.4"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
# objc 0.2's msg_send!/class! test a `cargo-clippy` feature, which newer Rust
# reports at every use (189 warnings a build). Declaring it keeps the build quiet.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
