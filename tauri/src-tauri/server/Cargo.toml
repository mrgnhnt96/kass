[package]
name = "kass-server"
version = "0.1.0"
description = "Kass's HTTP and WebSocket API. Routes not yet ported run in the Python model worker, which this proxies to."
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
caseless = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["net", "rt", "macros", "sync", "io-util", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
