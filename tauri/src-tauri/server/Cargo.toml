[package]
name = "kass-server"
version = "0.1.0"
description = "Kass's HTTP and WebSocket API. Routes not yet ported run in the Python model worker, which this proxies to."
edition = "2021"
publish = false

[dependencies]
# multipart: what a stand-in sends back (`routes::sync`).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json", "ws", "multipart"] }
caseless = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: numbers read back exactly as Python wrote them (the
# measurements saved with captures, `stream::prosody`).
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["net", "rt", "macros", "sync", "io-util", "time", "fs"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
# Silero voice detection for streamed dictation (`stream::speech`). Links a
# prebuilt ONNX Runtime, the same runtime the Python worker uses.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native"] }
# The dictation's recording, written as it arrives (`stream::intake`).
hound = "3.5"
# difflib, to find written words among the words heard (`stream::prosody`),
# learning corrections from reports (`learning`), and the text stages:
# dictionary matching, names (`dictionary::matching`, `known_names`).
kass-text = { path = "../text" }
# Model downloads from Hugging Face (`models::download`) and the daily usage
# report's upload to Amplitude (`usage::report`).
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "stream", "http2", "json"] }
# Calibration examples' ids, as Python hashes them (`cleanup_inputs`).
sha2 = "0.10"

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
