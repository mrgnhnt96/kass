[package]
name = "kass-server"
version = "0.1.0"
description = "Kass's HTTP and WebSocket API. Routes not yet ported run in the Python model worker, which this proxies to."
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
caseless = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: numbers read back exactly as Python wrote them (the
# measurements saved with captures, `stream::prosody`).
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["net", "rt", "macros", "sync", "io-util", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
# Silero voice detection for streamed dictation (`stream::speech`). Links a
# prebuilt ONNX Runtime, the same runtime the Python worker uses.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native"] }
# The dictation's recording, written as it arrives (`stream::intake`).
hound = "3.5"
# difflib, to find written words among the words heard (`stream::prosody`),
# learning corrections from reports (`learning`), and the text stages:
# dictionary matching, names (`dictionary::matching`, `known_names`).
kass-text = { path = "../text" }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
