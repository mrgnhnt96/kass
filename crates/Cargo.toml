[workspace]
resolver = "3"
members = ["kass-api", "kass-i18n", "kass-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
kass-api = { path = "kass-api" }
kass-i18n = { path = "kass-i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.dev.package."*"]
opt-level = 2
